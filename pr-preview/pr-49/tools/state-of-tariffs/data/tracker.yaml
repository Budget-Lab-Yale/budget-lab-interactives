# Fixed color per scenario, applied to every figure (overrides the default-first palette in
# build-manifest.py). Keyed by the scenario id from model-meta.json — these are vintage-dated, so
# re-check/update them each release. Any scenario omitted here falls back to the palette by order.
scenario_colors:
  tracker_actual_2026-11-01-19: blue                # Current law
  tracker_no_s338_2026-11-01-19: amber              # Current law excluding the Section 338 actions

tabs:
- id: introduction
  label: Introduction
  description: An interactive overview of the Budget Lab's tariff analysis — daily statutory rates, and the projected economic and fiscal effects of current and alternative tariff policy.
  figures:
  - overview

- id: statutory-rates
  label: Effective Tariff Rates
  description: U.S. tariff rates two ways — daily statutory rates (overall, by authority, by trading partner, and by product, for one policy scenario at a time; the grey band marks future projections under current policy), and effective rates derived from Treasury customs receipts.
  toggles:
  - id: annual_start
    label: Starting year
    default: '1790'
    applies_to_figures:
    - treasury-etr-annual
    options:
    - id: '1790'
      label: '1790'
    - id: '1822'
      label: '1822'
      spec:
        note: Through 1981, duties calculated as a percent of imports for consumption (HSUS series
          Ee429). From 1982, calendar-year net customs receipts as a percent of goods imports (NIPA
          Table 4.1). The dashed line continues the HSUS series through 2000 to show the difference
          between the two measures. Years end September 30 through 1842 and June 30 from 1843 to
          1915.
    - id: '1930'
      label: '1930'
      spec:
        note: Through 1981, duties calculated as a percent of imports for consumption (HSUS series
          Ee429). From 1982, calendar-year net customs receipts as a percent of goods imports (NIPA
          Table 4.1). The dashed line continues the HSUS series through 2000 to show the difference
          between the two measures.
        yAxisPolicy: {min: 0, max: 25, tickCount: 6}
    - id: '1982'
      label: '1982'
      spec:
        note: Calendar-year net customs receipts as a percent of goods imports (NIPA Table 4.1). The
          dashed line is the HSUS measure (duties calculated as a percent of imports for
          consumption, series Ee429), which the series uses through 1981.
        yAxisPolicy: {min: 0, max: 10, tickCount: 6}
  - id: monthly_start
    label: Starting month
    default: '2024'
    applies_to_figures:
    - treasury-etr-monthly
    options:
    - {id: '2015', label: Mar 2015}
    - {id: '2024', label: Jan 2024}
    - {id: '2025', label: Jan 2025}
  - id: measure
    label: Customs receipts
    default: gross
    applies_to_figures:
    - treasury-etr-monthly
    options:
    - {id: gross, label: Gross}
    - id: net
      label: Net of refunds
      spec:
        yAxisPolicy: {min: -10, max: 15, tickCount: 6}
        note: Customs receipts net of refunds, divided by the same month's imports for consumption.
          Refunds of IEEPA tariffs push net receipts below zero in May through July 2026. Duties
          are generally paid about a month after goods enter, so monthly ratios blur timing. The
          Treasury series begins in March 2015.
  - id: china
    label: China
    default: with
    # Render below the figure's scenario selector (this toggle refines a single figure; the
    # scenario picker is the broader control and reads first).
    after_selectors: true
    applies_to_figures:
    - daily-rate-by-country
    options:
    - {id: with, label: With China}
    - id: without
      label: Without China
      spec:
        series_order: [Canada, Mexico, EU, Japan, UK, Free-trade partners, Rest of World]
        yAxisPolicy: {min: 0, max: 25, tickCount: 6}
  sections:
  - id: daily-statutory
    label: Daily Statutory Rates
    figures:
    - daily-rate-overall
    - daily-rate-by-authority
    - daily-rate-by-country
    - daily-rate-by-hs
  - id: treasury-derived
    label: Treasury-Derived Rates
    figures:
    - treasury-etr-annual
    - treasury-etr-monthly

- id: default-scenario
  label: "Projected Effects:\nDefault Scenario"
  description: Projected effects of our default tariff policy scenario.
  sections:
  - id: overview
    label: ""
    figures:
    - summary-statistics
  - id: rates
    label: Tariff Rates
    figures:
    - etr-by-country
  - id: prices-households
    label: Prices & Households
    figures:
    - consumer-prices
    - distribution
  - id: economy
    label: Macroeconomy
    figures:
    - real-gdp
    - gdp-by-category
  - id: fiscal
    label: Fiscal
    figures:
    - revenue-by-year

- id: alternative-scenarios
  label: "Projected Effects:\nAlternative Scenarios"
  description: The same projected effects across all modeled policy scenarios. Use the toggle to view each scenario's own effects (levels) or its effect relative to our default scenario (change vs. default).
  toggles:
  - id: measure
    label: View
    default: level
    options:
    - {id: level, label: Levels}
    - {id: delta_vs_default, label: Change vs. default}
    applies_to_figures:
    - consumer-prices
    - distribution
    - real-gdp
    - gdp-by-category
    - revenue-by-year
  sections:
  - id: overview
    label: ""
    figures:
    - summary-statistics
  - id: rates
    label: Tariff Rates
    figures:
    - etr-by-country
  - id: prices-households
    label: Prices & Households
    figures:
    - consumer-prices
    - distribution
  - id: economy
    label: Macroeconomy
    figures:
    - real-gdp
    - gdp-by-category
  - id: fiscal
    label: Fiscal
    figures:
    - revenue-by-year

- id: methodology
  label: Methodology
  figures:
  - overview

- id: previous-vintages
  label: Previous Vintages
  description: Browse an earlier release of this report. Pick a vintage date and a scenario to see that version's projected effects exactly as published.
  # Content comes from data/previous-vintages/*/ (see sync-model-data.py archive_current +
  # build-manifest.py load_vintages). Dropped from the build when no vintages exist.
  kind: vintages
