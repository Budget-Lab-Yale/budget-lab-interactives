<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deficit Impact Calculator &mdash; The Budget Lab at Yale</title>
  <meta name="description" content="Estimate how federal deficits affect borrowing costs on auto loans, mortgages, and small business loans. An interactive tool from The Budget Lab at Yale." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&display=swap">

  <script>
    // Toggle html.iframed when this page is loaded inside an iframe so CSS
    // can drop the standalone-view horizontal padding and let the host
    // page control margins. Runs synchronously before content paints.
    if (window.self !== window.top) document.documentElement.classList.add('iframed');
  </script>

  <style>
    /* Map Mallory's bumped CSS weights to its actual installed variants so
       it renders at the original-design weights when locally installed. The
       +100 bump elsewhere in this file is calibrated for Figtree (Mallory's
       public fallback), which reads lighter at the same nominal weight.
       Without this remap, Mallory at the bumped weights reads heavier than
       originally designed. If Mallory isn't installed, these rules silently
       fail to resolve and the stack falls through to Figtree as intended. */
    @font-face {
      font-family: 'Mallory';
      src: local('Mallory Book'), local('MalloryBook'), local('Mallory-Book');
      font-weight: 500; font-style: normal;
    }
    @font-face {
      font-family: 'Mallory';
      src: local('Mallory Medium'), local('MalloryMedium'), local('Mallory-Medium');
      font-weight: 600; font-style: normal;
    }
    @font-face {
      font-family: 'Mallory';
      src: local('Mallory Bold'), local('MalloryBold'), local('Mallory-Bold');
      font-weight: 700; font-style: normal;
    }
    @font-face {
      font-family: 'Mallory';
      src: local('Mallory Bold'), local('MalloryBold'), local('Mallory-Bold');
      font-weight: 800; font-style: normal;
    }
    @font-face {
      font-family: 'Mallory';
      src: local('Mallory Black'), local('MalloryBlack'), local('Mallory-Black');
      font-weight: 900; font-style: normal;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Mallory', 'Figtree', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      font-weight: 500;
      color: #4A4A4A;
      background: #fff;
      line-height: 1.5;
    }
    .tbl-page {
      max-width: 940px;
      margin: 0 auto;
      padding: 0 20px;
      /* Scroll horizontally rather than letting the stage's min-width floor
         (below) overflow and clip. The scroll lives here, on the shared
         parent of the logo + calculator, so both scroll together. It must be
         an inner element (not html/body) because the embed iframe is
         scrolling="no", which only disables the iframe's own viewport bars. */
      overflow-x: auto;
    }
    /* When iframed, drop horizontal padding so the host page's container
       controls margins. Standalone view keeps the padding for breathing
       room from viewport edges. */
    html.iframed .tbl-page { padding: 0; }
    .tbl-calc-stage {
      max-width: 900px;
      /* Stop shrinking at ~250px (the narrowest width where the logo, heading
         and calculator controls still lay out cleanly); below that the
         .tbl-page scroll engages instead of cramming/colliding. The floor is
         on the stage, not the calculator, so the overlaid logo holds its
         position relative to the same box and scrolls with the card. */
      min-width: 250px;
      margin: 0 auto;
      position: relative;
      /* Zero line-height/font-size on the stage so the whitespace text
         node between <a> (inline, position:absolute) and <main> (block)
         doesn't generate an anonymous inline box that inherits body's
         line-height (~24px). Real children reset back to normal text. */
      line-height: 0;
      font-size: 0;
    }
    .tbl-calc-stage > * {
      line-height: 1.5;
      font-size: 16px;
    }
    .tbl-calc-logo-link {
      position: absolute;
      /* top is right + 8 to compensate for the calculator's margin-top:8px,
         so the visible insets from the calc card's top and right edges
         are equal. */
      top: 22px;
      right: 14px;
      z-index: 10;
      display: inline-block;
      line-height: 0;
    }
    .tbl-calc-logo {
      height: 30px;
      width: auto;
      display: block;
    }
    @media (max-width: 600px) {
      .tbl-page { padding: 0 14px; }
      /* top is set so the logo's bottom aligns with the baseline of the
         first label "ENTER YOUR LOAN AMOUNT", not so insets are equal. */
      .tbl-calc-logo-link { top: 23px; right: 10px; }
      .tbl-calc-logo { height: 24px; }
      /* On mobile the calc-body collapses to one column, so the overlaid
         logo now sits above the first label rather than the (desktop) empty
         results column. Reserve the logo's horizontal footprint (24px-tall
         logo ~= 96px wide + breathing room) on that first label so the
         "ENTER YOUR LOAN AMOUNT" heading wraps clear of the logo on narrow
         viewports instead of colliding with it. Wider phones, where the
         heading already fits on one line, are unaffected.

         max-width (not padding-right) is used deliberately: tool.js applies a
         "#uid * { padding: 0 }" reset whose ID specificity would override a
         padding rule set from here, but it never touches max-width, so this
         wins cleanly without !important. */
      .tbl-calc-stage .calc-inputs > .calc-field:first-child > label { max-width: calc(100% - 108px); }
    }
  </style>
</head>
<body>
  <div class="tbl-page">
    <div class="tbl-calc-stage">
      <a class="tbl-calc-logo-link" href="https://budgetlab.yale.edu/research/deficits-and-affordability-tool" target="_blank" rel="noopener" aria-label="The Budget Lab at Yale">
        <img class="tbl-calc-logo" src="../../assets/logo.svg" alt="The Budget Lab at Yale" />
      </a>
      <main>
        <script src="tool.js"></script>
      </main>
    </div>
  </div>

  <script src="../../embed/v1/iframeResizer.contentWindow.min.js"></script>
</body>
</html>
