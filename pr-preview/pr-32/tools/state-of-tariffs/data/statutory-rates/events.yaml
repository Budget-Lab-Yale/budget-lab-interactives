# Shared policy-event annotations for the Daily Statutory Rates figures.
# A figure opts in with `events: major` (or `events: [major, projection]`) in its config.md
# frontmatter; the build copies the named group into spec.annotations, filtered to that figure's
# date range. Edit here once and every figure picks it up.
#
# A named group is either a flat list (treated as xAxis reference lines) OR a mapping with
# `xAxis` and/or `bands` keys. Each xAxis entry is an engine annotation ({x, label, style?,
# color?, labelSide?}); x is the effective date (YYYY-MM-DD). A date of `today` (in an xAxis x or
# a band start/end) resolves to the build date when the manifest is generated.
projection:
  xAxis:
  - x: '2026-07-23'
    label: Section 122 expiry
    color: red
    style: dashed
  - x: '2026-07-23'
    label: 'Section 301 "forced labor" enacted'
    color: red
    style: dashed
  bands:
  - start: today
    end: '2026-12-31'

major:
- x: '2025-02-04'
  label: Early fentanyl tariffs
  labelSide: middle
- x: '2025-04-02'
  label: Liberation Day
  labelSide: middle
- x: '2025-08-07'
  label: Reciprocal Phase 2
- x: '2026-02-24'
  label: IEEPA struck down
  labelSide: left
- x: '2026-04-06'
  label: Section 232 reorg
