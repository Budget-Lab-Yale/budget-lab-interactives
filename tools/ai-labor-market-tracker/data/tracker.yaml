release:
  updated: August 19, 2026
  version: '1.0'
tabs:
- id: current-update
  label: Current Update
  description: Summary of the most significant findings in the current data release.
- id: occupational-churn
  label: Occupational Churn
  description: Estimates of occupational "churn" in the form of a dissimilarity index. Interpreted as the percentage point shift in the occupational composition of the labor force. Updated monthly.
  figureDefaults:
    yAxisPolicy:
      includeZero: true
      tickCount: 5
    # Canonical industry colors, shared across the industry figures (Selected
    # Industries, Major Industries) and the By-Industry selector. Figures
    # apply only the keys matching their own series; others are ignored.
    # The three Selected-Industries industries take the first palette colors; the
    # remaining Major Industries continue the palette (Natural Resources on).
    # All Sectors is the aggregate reference line (Selected Industries only).
    series_colors:
      All Sectors: black
      Information: blue
      Financial Activities: amber
      Professional and Business Services: violet
      Natural Resources and Mining: green
      Construction: red
      Manufacturing: rose
      'Trade, Transportation, and Utilities': russet
      Education and Health Services: red-light
      Leisure and Hospitality: green-light
      Other Services: rose-light
  sections:
  - id: by-time-period
    label: Overall Labor Force
    figures:
    - total-labor-force-recent
    - total-labor-force-historical
  - id: by-industry
    label: By Industry
    figures:
    - selected-industries-recent
    - by-industry-recent
    - major-industries-historical
  - id: by-group
    label: By Demographic Group
    figures:
    - new-vs-older-grads-recent
    - new-vs-older-grads-historical
  toggles:
  - id: variant
    label: Baseline
    options:
    - id: indexed
      label: Fixed
    - id: rolling
      label: Rolling 12-month
    default: indexed
    applies_to_figures:
    - total-labor-force-recent
    - selected-industries-recent
    - by-industry-recent
    - major-industries-historical
- id: ai-metrics
  label: AI Metrics
  description: Estimates of how AI exposure or usage in the labor market are changing
    over time. Updated monthly.
  figureDefaults:
    yAxisPolicy:
      min: 0
      max: 80
      tickCount: 5
  sections:
  - id: exposure
    label: Exposure
    figures:
    - workers-by-exposure-level
    - task-exposure-among-unemployed
    - highest-exposure-share-among-unemployed
  - id: auto-vs-aug
    label: Automation Versus Augmentation
    figures:
    - automation-vs-augmentation-usage
    - automated-vs-augmented-occupations
    - automated-tasks-by-unemployment-duration
    - automated-occupations-by-unemployment-duration
    - augmented-tasks-by-unemployment-duration
    - augmented-occupations-by-unemployment-duration
  toggles:
  - id: panel
    label: Task coverage
    options:
    - id: observed
      label: Observed tasks only
    - id: missing-as-zero
      label: Missing tasks coded as zeros
    default: observed
    applies_to_figures:
    - automation-vs-augmentation-usage
    - automated-vs-augmented-occupations
    - automated-tasks-by-unemployment-duration
    - automated-occupations-by-unemployment-duration
    - augmented-tasks-by-unemployment-duration
    - augmented-occupations-by-unemployment-duration
- id: comparisons
  label: Comparisons of AI-Exposed and Unexposed Workers
  description: Synthetic differences-in-differences estimates of how AI-exposed and AI-unexposed labor market outcomes have evolved since late 2022. Updated quarterly.
  figureDefaults:
    xAxisType: quarterly
    xAxisPolicy:
      markers:
      - x: 2022Q4
        label: Treatment
  figures:
  - employment-shares
  - real-hourly-wages
  - unemployment-rate
