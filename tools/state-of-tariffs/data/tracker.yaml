release:
  updated: April 8, 2026
  version: '1.0'

tabs:
- id: current-update
  label: Current Update
  show_release: true   # show the updated-date + version in this tab's sidebar
  description: This tool consolidates the Budget Lab's up-to-date analysis of tariffs. See the most recent projected impacts of tariffs in this tab and the daily effective tariff rate in the next tab.
  sections:
  - id: overview
    label: ""   # no section heading above the Summary pane
    figures:
    - summary
  - id: rates
    label: Tariff Rates
    figures:
    - etr-since-1790
    - daily-etr
    - etr-by-country
  - id: economic-effects
    label: Economic Effects
    figures:
    - gdp-level
    - gdp-by-sector
    - gdp-by-region
  - id: fiscal-impact
    label: Fiscal Impact
    figures:
    - revenue
  - id: households-prices
    label: Households & Prices
    figures:
    - distribution-by-decile
    - prices-by-category

- id: tariff-rate-tracker
  label: Tariff Rate Tracker
  description: Daily effective U.S. tariff rates from The Budget Lab's open-source Tariff Rate Tracker — overall, by authority, by trading partner, and by commodity. Vertical markers flag major tariff-policy changes.
  sections:
  - id: overall
    label: Overall Rate
    figures:
    - daily-etr
    - etr-by-authority
  - id: by-partner
    label: By Trading Partner
    figures:
    - china-vs-row
    - etr-by-partner
  - id: by-commodity
    label: By Commodity
    figures:
    - etr-by-commodity
