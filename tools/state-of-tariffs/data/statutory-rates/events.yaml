# Shared policy-event annotations for the Daily Statutory Rates figures.
# A figure opts in with `events: major` (or `events: [major, projection]`) in its config.md
# frontmatter; the build copies the named group into spec.annotations, filtered to that figure's
# date range. Edit here once and every figure picks it up.
#
# A named group is either a flat list (treated as xAxis reference lines) OR a mapping with
# `xAxis` and/or `bands` keys. Each xAxis entry is an engine annotation ({x, label, style?,
# color?, labelSide?}); x is the effective date (YYYY-MM-DD). A date of `today` (in an xAxis x or
# a band start/end) resolves to the release date of the synced vintage (model-meta.json
# `published_at`), NOT the wall clock — so rebuilding a vintage yields the same manifest on any day.
projection:
  xAxis:
  - x: '2026-07-23'
    label: Section 122 expiry
    color: red
    style: dashed
  - x: '2026-07-23'
    label: 'Section 301 "forced labor" enacted'
    color: red
    style: dashed
  # The proposed excess-capacity Section 301 tariffs start 2027-04-01 in the as-proposed
  # scenario only. Markers are shared by every scenario in the selector, so this line also
  # shows on current law, where nothing changes that day.
  - x: '2027-04-01'
    label: Proposed Section 301 tariffs (assumed start)
    labelSide: left
    # Mid-height, out of the top stagger: up there it overlapped or crossed the two July 2026
    # labels, which share a date and fill the top rows.
    labelPosition: middle
    color: red
    style: dashed
  bands:
  # The tracker series now ends 2027-06-30 (previously 2026-12-31).
  - start: today
    end: '2027-06-30'

major:
- x: '2025-02-04'
  label: Early fentanyl tariffs
  labelSide: middle
- x: '2025-04-02'
  label: Liberation Day
  labelSide: middle
- x: '2025-08-07'
  label: Reciprocal Phase 2
- x: '2026-02-24'
  label: IEEPA struck down
  labelSide: left
- x: '2026-04-06'
  label: Section 232 reorg
